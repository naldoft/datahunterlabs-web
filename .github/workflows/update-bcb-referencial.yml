name: 🏦 Actualizar BCB Oficial (TCO)

# ── Cuándo corre ─────────────────────────────────────────────────────────────
on:
  schedule:
    # Cada hora entre 12:00 y 22:00 UTC (08:00 - 18:00 La Paz UTC-4), lunes a viernes.
    # El BCB publica el TCO (Tipo de Cambio Oficial) por día hábil.
    # Si el valor no cambió, el script sale con exit 2 y no genera commit.
    - cron: '0 12-22 * * 1-5'

  # También permite ejecutarlo manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:

# ── Permisos ──────────────────────────────────────────────────────────────────
permissions:
  contents: write   # Necesario para hacer push del commit

# ── Job ───────────────────────────────────────────────────────────────────────
jobs:
  update:
    name: Actualizar TCO oficial BCB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout del repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configurar Node.js (ya viene instalado en ubuntu-latest)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Ejecutar el script de actualización
      #    set +e para capturar el exit code sin abortar el paso:
      #      exit 0 = dato nuevo · exit 2 = sin cambios · exit 1 = ERROR real
      - name: Descargar y parsear TCO del BCB
        id: bcb
        run: |
          set +e
          node .github/scripts/update-bcb.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # 4. Verificar si hubo cambios reales
      - name: Verificar si hay cambios
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ index.html sin cambios — BCB no publicó hoy o ya estaba al día."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ index.html modificado — hay dato nuevo."
          fi

      # 5. Commit y push solo si hubo cambios
      - name: Commit y push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(bcb): TCO oficial ${{ steps.bcb.outputs.fecha }} = Bs ${{ steps.bcb.outputs.valor }} [bot]"
          git push

      # 6. Resumen en el log de GitHub Actions
      - name: Resumen
        run: |
          if [ "${{ steps.check.outputs.changed }}" == "true" ]; then
            echo "### ✅ TCO oficial actualizado" >> $GITHUB_STEP_SUMMARY
            echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Fecha de corte | ${{ steps.bcb.outputs.fecha }} |" >> $GITHUB_STEP_SUMMARY
            echo "| TCO (Bs/USD) | Bs ${{ steps.bcb.outputs.valor }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Sin cambios — BCB no publicó nuevo TCO hoy" >> $GITHUB_STEP_SUMMARY
          fi

      # 7. ALERTA si el bot falló de verdad (exit 1 = error de red/parseo del BCB)
      #    - Telegram: aviso instantáneo al celular (si los secrets están configurados)
      #    - Email: al hacer fallar el job (exit 1), GitHub envía su email nativo de fallo
      - name: Alertar si el bot falló
        if: steps.bcb.outputs.exit_code == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="🔴 DataHunterLabs: el bot del BCB FALLÓ (exit 1). Probablemente el BCB cambió el formato de su CSV otra vez. Revisá: ${RUN_URL}"
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MSG}" >/dev/null && echo "📲 Alerta Telegram enviada."
          else
            echo "ℹ️ Telegram no configurado (faltan secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)."
          fi
          echo "::error::$MSG"
          exit 1   # hace fallar el job → GitHub envía el email de fallo al dueño del repo
